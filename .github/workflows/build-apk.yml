name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build Web Application (Vite PWA)
        run: npm run build

      - name: 5. Copy Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: 6. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 7. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 8. Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: 9. Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 10. Prepare Artifacts
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/*.apk output-apk/medione-pharmacy-debug.apk
          ls -lh output-apk/

      - name: 11. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medione-pharmacy-debug-apk
          path: output-apk/medione-pharmacy-debug.apk
          retention-days: 30

      - name: 12. Publish GitHub Release (When Tagged or on Push to Main)
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: MediOne Pharmacy Android APK (Direct Download)
          body: |
            ## MediOne Pharmacy POS - Android Mobile Installation File
            
            🎉 **Official Android APK is ready for download!**
            
            ### 📥 How to Install:
            1. Download **`medione-pharmacy-debug.apk`** below.
            2. Open the file on your Android mobile.
            3. If prompted, allow "Install from this source".
            4. Tap **Install** and launch MediOne Pharmacy with full offline support & barcode scanner!
          files: output-apk/medione-pharmacy-debug.apk
          draft: false
          prerelease: false
        continue-on-error: true
